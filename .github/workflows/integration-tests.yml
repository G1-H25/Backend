name: Integration Tests

on:
  push:
  #  branches:
  #    - main
  #    - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  build_and_run_integration_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install docker-compose (if not already installed)
      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # Start docker-compose services
      - name: Start Docker Compose services
        run: docker-compose up -d

      # Wait for backend to be ready
      - name: Wait for backend readiness
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            
            if [ "$status_code" = "200" ]; then
              echo "Backend is ready!"
              break
            else
              echo "Backend not ready yet (status $status_code), waiting..."
              sleep 2
            fi

            if [ "$i" = "60" ]; then
              echo "Backend did not become ready in time, exiting."
              exit 1
            fi
          done


      # Setup .NET SDK
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore GpsApp/GpsApp.csproj

      # Build the project
      - name: Build project
        run: dotnet build GpsApp/GpsApp.csproj --configuration Release

      # Run integration tests
      - name: Run integration tests
        run: dotnet test GpsApp.Tests/integration/GpsApp.Tests.Integration.csproj --configuration Release --logger "trx"

      # Upload test results artifact
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/TestResults/*.trx'

      # Tear down Docker Compose services regardless of previous step status
      - name: Tear down Docker Compose
        if: always()
        run: docker-compose down


